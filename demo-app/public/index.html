<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Todos</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Todos</h1>
    <form id="new-todo">
      <input id="title" name="title" placeholder="What needs doing?" autocomplete="off" maxlength="200" required>
      <button type="submit">Add</button>
    </form>
    <p id="error" role="alert" hidden></p>
    <ul id="list"></ul>
    <footer>
      <span id="left"></span>
    </footer>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
