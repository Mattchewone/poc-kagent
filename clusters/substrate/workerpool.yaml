# Shape copied from Substrate v0.5.0 demos/counter/counter.yaml.tmpl.
apiVersion: v1
kind: Namespace
metadata: {name: poc}
---
apiVersion: ate.dev/v1alpha1
kind: WorkerPool
metadata:
  name: poc
  namespace: poc
  labels: {workload: poc}
spec:
  replicas: 3
  workerImage: ${WORKER_IMAGE}   # ko-built ateom-gvisor; substrate-poc.sh copies it from the counter pool
  sandboxClasses:
    - name: gvisor
  template:
    resources:
      limits: {cpu: "1", memory: 1Gi}
      requests: {cpu: 250m, memory: 1Gi}
