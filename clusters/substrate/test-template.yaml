# Test actor: one per attempt, fresh copy of target/, deleted after the run.
# Started from Substrate v0.5.0's counter template; image and probe changed.
# ${IMAGE} is replaced by `make substrate-templates` with a pinned @sha256 digest.
metadata:
  atespace: poc
  name: test
workerSelector:
  matchLabels: {workload: poc}
containers:
  - name: test
    image: ${IMAGE}
    command: ["python", "/opt/poc/agent/fake_agent.py", "serve", "80"]
    wakeupProbe:
      httpGet: {path: /readyz, port: 80}
resources:
  limits:
    - {name: cpu, quantity: "1"}
    - {name: memory, quantity: 512Mi}
snapshotConfig:
  preferredFidelity: SNAPSHOT_FIDELITY_MEMORY
  storageLocation: gs://ate-snapshots/poc/test/
sandboxConfig:
  sandboxClass: gvisor
  configName: gvisor-default
