# Two agents, both Claude Code (kagent's Claude harness + node) on Substrate actors.
# Rendered by scripts/kagent-apply.sh, which substitutes ${HARNESS_IMAGE} (sha256-pinned).
#
#   Harness          claude runtime on the kagent-default WorkerPool, our image with node
#   ModelConfig      Anthropic, key from the kagent-anthropic Secret `kagent install` created;
#                    Substrate's gateway injects it, the actor only ever sees a placeholder
#   EgressPolicy     Gitea on the host (anonymous clone). MCP origins are added automatically.
#   RemoteMCPServer  pipeline          /mcp        submit_revision, get_work       (dev-agent)
#                    delivery          /mcp-chat   start/get/wait/list work, feedback, abandon
#                    delivery-release  /mcp-gated  merge_pull_request, promote     (requireApproval)
#                    split because the Claude harness gates whole servers, not single tools
#   Agent dev-agent       the coder. Temporal invokes it over A2A, one session per work item
#                         (worker/work.py); it never decides when a PR opens or merges.
#   Agent delivery-agent  the chat front door: starts work items, relays review feedback, and
#                         merges / promotes behind a human Approve click.
apiVersion: api.kagent.dev/v1alpha3
kind: Harness
metadata:
  name: claude-node
  namespace: kagent
spec:
  claude: {}
  workload:
    image: ${HARNESS_IMAGE}
  substrate:
    workerPoolRef:
      name: kagent-default
    snapshotPolicy:
      location: s3://ate-snapshots/kagent/
---
apiVersion: api.kagent.dev/v1alpha3
kind: ModelConfig
metadata:
  name: dev-agent-model
  namespace: kagent
spec:
  provider: Anthropic
  model: ${DEV_AGENT_MODEL}
  apiKeySecret: kagent-anthropic
  apiKeySecretKey: ANTHROPIC_API_KEY
  # The Claude harness accepts no Anthropic provider options except baseUrl (kagent 1.0.1).
---
apiVersion: api.kagent.dev/v1alpha3
kind: EgressPolicy
metadata:
  name: gitea
  namespace: kagent
spec:
  destinations:
    - origin: http://host.docker.internal:${GITEA_PORT}
---
apiVersion: api.kagent.dev/v1alpha3
kind: RemoteMCPServer
metadata:
  name: pipeline
  namespace: kagent
spec:
  description: Submit a revision for a work item; it is verified in a fresh sandbox and the result returned.
  url: http://host.docker.internal:${PIPELINE_PORT}/mcp
  protocol: STREAMABLE_HTTP
  timeout: 10m
  sseReadTimeout: 10m
---
apiVersion: api.kagent.dev/v1alpha3
kind: RemoteMCPServer
metadata:
  name: delivery
  namespace: kagent
spec:
  description: Start and follow work items (Temporal), send review feedback, abandon.
  url: http://host.docker.internal:${PIPELINE_PORT}/mcp-chat
  protocol: STREAMABLE_HTTP
  timeout: 10m
  sseReadTimeout: 10m
---
apiVersion: api.kagent.dev/v1alpha3
kind: RemoteMCPServer
metadata:
  name: delivery-release
  namespace: kagent
spec:
  description: Merge a work item's PR or promote its release to staging/prod (human approval required).
  url: http://host.docker.internal:${PIPELINE_PORT}/mcp-gated
  protocol: STREAMABLE_HTTP
  timeout: 5m
---
apiVersion: api.kagent.dev/v1alpha3
kind: Agent
metadata:
  name: dev-agent
  namespace: kagent
spec:
  harnessRef:
    name: claude-node
  egressPolicyRefs:
    - name: gitea
  template:
    inline:
      description: >-
        The coder behind the delivery pipeline. Temporal invokes it for each work item: it implements
        the change with tests and submits revisions for verification. Chat with delivery-agent instead.
      modelConfig:
        name: dev-agent-model
      systemPromptFrom:
        name: dev-agent-prompt
        key: prompt.md
      tools:
        - mcp:
            server:
              kind: RemoteMCPServer
              name: pipeline
---
apiVersion: api.kagent.dev/v1alpha3
kind: Agent
metadata:
  name: delivery-agent
  namespace: kagent
spec:
  harnessRef:
    name: claude-node
  template:
    inline:
      description: >-
        Ask for a feature or a bug fix in demo-todo. It starts a work item that Temporal runs end to
        end: the dev agent codes and verifies it, a PR opens with a preview environment, and once you
        merge, Kargo rolls the release out dev -> staging -> prod.
      modelConfig:
        name: dev-agent-model
      systemPromptFrom:
        name: delivery-agent-prompt
        key: prompt.md
      tools:
        - mcp:
            server:
              kind: RemoteMCPServer
              name: delivery
        - mcp:
            server:
              kind: RemoteMCPServer
              name: delivery-release
            requireApproval: true
