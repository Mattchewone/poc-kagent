# Milestone 2 exit check: default-deny must block pod-to-pod curl.
apiVersion: v1
kind: Namespace
metadata: {name: netpol-check}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: default-deny, namespace: netpol-check}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: v1
kind: Pod
metadata: {name: server, namespace: netpol-check, labels: {app: server}}
spec:
  containers: [{name: web, image: nginx:1.27-alpine}]
---
apiVersion: v1
kind: Pod
metadata: {name: client, namespace: netpol-check}
spec:
  containers: [{name: c, image: curlimages/curl:8.10.1, command: ["sleep", "3600"]}]
