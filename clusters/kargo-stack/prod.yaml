# Workload cluster: demo-todo prod. Host access via an edge container.
# Created by scripts/kargo-up.sh. Same name as the standalone kargo stack, so an existing one is reused.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: kargo-prod
containerdConfigPatches:
  - |-
    [plugins."io.containerd.grpc.v1.cri".registry]
      config_path = "/etc/containerd/certs.d"
nodes:
  - role: control-plane

