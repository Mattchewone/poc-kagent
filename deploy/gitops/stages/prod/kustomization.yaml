apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: demo-todo-prod
resources:
  - ../../base
patches:
  - target: { kind: Service, name: demo-todo }
    patch: |-
      - op: add
        path: /spec/ports/0/nodePort
        value: 31083
  - target: { kind: Rollout, name: demo-todo }
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: { name: STAGE, value: prod }
# Kargo sets the tag below on every promotion.
images:
  - name: kargo-registry:5000/demo-todo
    newTag: placeholder
